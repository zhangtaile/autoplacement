name = "autoplacement"
main = "src/index.ts"
compatibility_date = "2024-05-02"
workers_dev = false

# 定时任务配置：在北京时间 09:05 和 16:05 执行切换
[triggers]
crons = ["5 1 * * *", "5 8 * * *"] 

[vars]
# 目标 Worker 的名称
TARGET_WORKER_NAME = "follownewfei"

[observability]
enabled = true

# 注意：CLOUDFLARE_ACCOUNT_ID 和 CLOUDFLARE_API_TOKEN 应该作为 Secret 存储
# 使用以下命令添加：
# wrangler secret put CLOUDFLARE_ACCOUNT_ID
# wrangler secret put CLOUDFLARE_API_TOKEN
